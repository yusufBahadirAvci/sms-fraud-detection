# DVC pipeline: a list of stages. DVC remembers the inputs (deps) and
# outputs (outs) of each stage. On "dvc repro" it runs a stage again ONLY
# if one of its inputs changed. This saves time and makes results reproducible.
#
# Order (DVC finds it from the deps):
#   prepare ---------> eda
#      |    \--------> train ---\
#      |                         > monitor
#   prepare_turkish ------------/
stages:
  prepare:
    cmd: python -m src.sms_fraud.data
    # A stage with NO deps is treated as "always changed" and would run every
    # time. So we list the code and the config it depends on.
    deps:
      - src/sms_fraud/data.py
      - config/config.yaml
    # We list the two files, not the whole data/processed folder. Why? Two
    # stages cannot own the same folder, and prepare_turkish also writes
    # into data/processed.
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  prepare_turkish:
    cmd: python -m src.sms_fraud.turkish_data
    deps:
      # The raw file is tracked by DVC (TurkishSMSCollection.csv.dvc).
      - data/external/TurkishSMSCollection.csv
      - src/sms_fraud/turkish_data.py
      # turkish_data.py reuses validate_data() from here.
      - src/sms_fraud/data.py
      - config/config.yaml
    outs:
      - data/processed/turkish.csv

  eda:
    cmd: python -m src.sms_fraud.eda
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/sms_fraud/eda.py
      # eda.py reads the keyword list from here (for observation 3).
      - src/sms_fraud/rule_based.py
    outs:
      - reports/figures
      - reports/eda_summary.md

  train:
    cmd: python -m src.sms_fraud.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/sms_fraud/train.py
      - config/config.yaml
    outs:
      - models/model.joblib
    metrics:
      # cache: false -> this small JSON file is saved in Git (not in the DVC
      # cache), so we can see metric changes in "git diff" and "dvc metrics".
      - reports/metrics.json:
          cache: false
    plots:
      # The confusion matrix image of the pipeline model. Also kept in Git.
      - reports/confusion_matrix.png:
          cache: false

  monitor:
    # Dataset mode: English test set vs labelled Turkish data.
    cmd: python -m src.sms_fraud.monitoring
    deps:
      - models/model.joblib
      - data/processed/test.csv
      - data/processed/turkish.csv
      # The code and the thresholds (in config.yaml) also change the result.
      - src/sms_fraud/monitoring.py
      - src/sms_fraud/text_stats.py
      - config/config.yaml
    outs:
      - reports/monitoring
