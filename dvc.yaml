# DVC pipeline: a list of stages. DVC remembers the inputs (deps) and
# outputs (outs) of each stage. On "dvc repro" it runs a stage again ONLY
# if one of its inputs changed. This saves time and makes results reproducible.
#
# Order (DVC finds it from the deps):
#   prepare ---------> eda
#      |    \
#      |     > combine -----> train  (candidates A, B, C + metrics.json)
#   prepare_turkish /           |       (prepare + prepare_turkish -> leakage)
#                               v
#                   [promote.py, by hand]  -> models/model.joblib
#                                                    |
#   test sets ----------------------------------> monitor
#
# Why is promotion NOT a DVC stage? Its result depends on the CURRENT
# production model (the champion), not only on files in this repo. DVC
# stages must give the same output for the same inputs. So promote.py runs
# by hand, and models/model.joblib is tracked by "dvc add"
# (models/model.joblib.dvc) instead of being a stage output.
stages:
  prepare:
    cmd: python -m src.sms_fraud.data
    # A stage with NO deps is treated as "always changed" and would run every
    # time. So we list the code and the config it depends on.
    deps:
      - src/sms_fraud/data.py
      # Step 7a: the split groups near-duplicates with leakage.cluster_ids().
      - src/sms_fraud/leakage.py
      - config/config.yaml
    # We list the files, not the whole data/processed folder. Why? Two
    # stages cannot own the same folder, and other stages also write
    # into data/processed.
    outs:
      # All clean English rows (Step 7a; the leakage stage needs them).
      - data/processed/english.csv
      - data/processed/train.csv
      - data/processed/test.csv

  prepare_turkish:
    cmd: python -m src.sms_fraud.turkish_data
    deps:
      # The raw file is tracked by DVC (TurkishSMSCollection.csv.dvc).
      - data/external/TurkishSMSCollection.csv
      - src/sms_fraud/turkish_data.py
      # turkish_data.py reuses validate_data() and leakage_safe_split() from here.
      - src/sms_fraud/data.py
      - src/sms_fraud/leakage.py
      - config/config.yaml
    outs:
      - data/processed/turkish.csv
      - data/processed/turkish_train.csv
      - data/processed/turkish_test.csv

  leakage:
    # Step 7a: how many test messages have a (near-)copy in train?
    # Compares the OLD random split (rebuilt from english.csv / turkish.csv)
    # with the NEW clean split, for each language.
    cmd: python -m src.sms_fraud.leakage
    deps:
      - data/processed/english.csv
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/turkish.csv
      - data/processed/turkish_train.csv
      - data/processed/turkish_test.csv
      - src/sms_fraud/leakage.py
      - src/sms_fraud/data.py
      - config/config.yaml
    outs:
      # Small Markdown file: kept in Git, so we can read it on GitHub.
      - reports/leakage.md:
          cache: false

  combine:
    # English train + Turkish train -> one train set with a "lang" column.
    cmd: python -m src.sms_fraud.combine_data
    deps:
      - data/processed/train.csv
      - data/processed/turkish_train.csv
      - src/sms_fraud/combine_data.py
    outs:
      - data/processed/combined_train.csv

  eda:
    cmd: python -m src.sms_fraud.eda
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/sms_fraud/eda.py
      # eda.py reads the keyword list from here (for observation 3).
      - src/sms_fraud/rule_based.py
    outs:
      - reports/figures
      - reports/eda_summary.md

  train:
    # Runs A, B, C from config.yaml. Writes CANDIDATES only; it does not
    # touch models/model.joblib (promote.py decides that).
    cmd: python -m src.sms_fraud.train
    deps:
      - data/processed/combined_train.csv
      # The two test sets, kept separate (en_ and tr_ metrics).
      - data/processed/test.csv
      - data/processed/turkish_test.csv
      - src/sms_fraud/train.py
      - config/config.yaml
    outs:
      - models/candidates
    metrics:
      # cache: false -> this small JSON file is saved in Git (not in the DVC
      # cache), so we can see metric changes in "git diff" and "dvc metrics".
      - reports/metrics.json:
          cache: false
    plots:
      # One confusion matrix per run and language. Also kept in Git.
      - reports/confusion_matrices:
          cache: false

  challenge:
    # Step 7a: score the champion on 40 hand-written Turkish phishing / normal
    # messages. EVALUATION ONLY: no stage ever trains on this file.
    cmd: python -m src.sms_fraud.challenge
    deps:
      - models/model.joblib
      # Small hand-written file, kept in Git (not DVC).
      - data/challenge/tr_phishing.csv
      - src/sms_fraud/challenge.py
      - config/config.yaml
    metrics:
      - reports/challenge.json:
          cache: false
    outs:
      - reports/challenge.md:
          cache: false

  monitor:
    # Dataset mode: combined test set (reference) vs Turkish test set (current).
    cmd: python -m src.sms_fraud.monitoring
    deps:
      # Tracked by models/model.joblib.dvc (written by promote.py).
      - models/model.joblib
      - data/processed/test.csv
      - data/processed/turkish_test.csv
      # The code and the thresholds (in config.yaml) also change the result.
      - src/sms_fraud/monitoring.py
      - src/sms_fraud/text_stats.py
      - src/sms_fraud/train.py
      - config/config.yaml
    outs:
      - reports/monitoring
