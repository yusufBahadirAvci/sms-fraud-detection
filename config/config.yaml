# Project settings in ONE place.
# Why? If we want to change a path or a number, we change it here only,
# not in many Python files.
# All paths are relative to the project root folder.

data:
  # Where we download the dataset from (UCI SMS Spam Collection).
  url: "https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip"
  # Folder for the original, untouched files.
  raw_dir: "data/raw"
  # Name of the data file inside the zip.
  raw_file: "SMSSpamCollection"
  # Folder for the cleaned and split files.
  processed_dir: "data/processed"
  # Turkish SMS data (tracked with DVC, not Git). Used to test the English
  # model on another language and to measure drift (Step 5).
  turkish_raw_file: "data/external/TurkishSMSCollection.csv"
  turkish_file: "data/processed/turkish.csv"

split:
  # 20% of the rows go to the test set, 80% to the train set.
  test_size: 0.2
  # A fixed "seed" makes the random split the same every time we run it.
  # This makes our results reproducible.
  random_state: 42

model:
  # Hyperparameters = settings we choose BEFORE training.
  # max_features: keep only the 5000 most common words/word pairs.
  max_features: 5000
  # ngram_range [1, 2]: use single words ("free") and word pairs ("free gift").
  ngram_range: [1, 2]
  # Which classifier to use: "logreg" (Logistic Regression) or "nb" (Naive Bayes).
  name: "logreg"
  # C (logreg only): how strongly the model may fit the training data.
  # Small C = simpler model, big C = fits the training data more closely.
  # 10.0 was the best value in our MLflow experiments (Step 3: F1 0.938).
  C: 10.0
  # alpha (nb only): "smoothing". It gives a tiny count to words never seen
  # in a class, so one unknown word cannot make a probability zero.
  alpha: 1.0
  # Where to save the trained model, its scores and its confusion matrix.
  model_path: "models/model.joblib"
  metrics_path: "reports/metrics.json"
  confusion_matrix_path: "reports/confusion_matrix.png"

mlflow:
  # Local folder where MLflow saves everything:
  #   mlruns/mlflow.db  -> a small SQLite database with runs, params, metrics
  #                        and the Model Registry
  #   mlruns/artifacts/ -> the saved model files
  # (New MLflow versions no longer accept plain folders as the run store,
  #  so we use a local database file instead.)
  tracking_dir: "mlruns"
  experiment_name: "sms-fraud"
  registered_model_name: "sms-fraud-classifier"

api:
  # If the spam probability is at least this value, we say "fraud".
  # 0.5 is the normal default. Later we can move it to catch more spam
  # (lower value) or to block fewer normal SMS (higher value).
  threshold: 0.5
  # Every prediction is added as one JSON line here (used for monitoring).
  predictions_log: "logs/predictions.jsonl"

monitoring:
  # Dataset mode (English test.csv vs Turkish data). Made by the DVC "monitor" stage.
  output_dir: "reports/monitoring"
  # Log mode (English test.csv vs live API traffic). Not part of DVC.
  live_output_dir: "reports/monitoring_live"
  # Number of equal-width bins (0.0-0.1, 0.1-0.2, ...) for the PSI.
  psi_bins: 10
  # If a value crosses its threshold, we raise a "DRIFT ALERT".
  thresholds:
    # More than half of the words are unknown to the model.
    oov_ratio: 0.5
    # KS test p-value below 0.05: the length distributions are "really"
    # different (only a 5% chance that the difference is random).
    ks_pvalue: 0.05
    # PSI above 0.2 is the usual rule of thumb for a "big" shift.
    psi: 0.2
    # F1 is more than 0.10 lower than on the English test set.
    f1_drop: 0.10

logging:
  log_file: "logs/app.log"
